name: Server secret store

on:
  pull_request:
    paths:
      - "apps/server/src/secrets/**"
      - "apps/server/src/main_lib.rs"
      - "apps/server/src/config.rs"
      - "apps/server/src/auth.rs"
      - "apps/server/Cargo.toml"
      - "crates/core/src/secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/server-secret-store.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vault:
    name: Vault compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test vault compatibility, validation, and persistence
        run: cargo test --locked -p wealthfolio-server --lib secrets
      - name: Test environment and file key inputs
        run: cargo test --locked -p wealthfolio-server --lib config::tests
