name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python3 .github/scripts/ci_changes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  frontend-check:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package types
        run: pnpm run build:types

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install addon sandbox browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run net worth layout regression tests
        run: pnpm test:e2e:net-worth

      - name: Run addon sandbox browser tests
        run: pnpm test:e2e:addon-sandbox
        env:
          WF_ADDON_SANDBOX_SKIP_BUILD: "true"

  rust-check:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Create dist folder for Tauri context
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # Required for outbox tests in storage-sqlite
          CONNECT_API_URL: http://test.local

      - name: Check release build (src-server)
        run: cargo check -p wealthfolio-server --release

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [changes, frontend-check, rust-check]
    if: always()

    steps:
      - name: Check build status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          FRONTEND_RESULT: ${{ needs.frontend-check.result }}
          RUST_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$FRONTEND_RESULT" = success
          fi
          if [ "$RUST_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          fi
          echo "All required checks passed."
