[package]
name = "wealthfolio-market-data"
version.workspace = true
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
num-traits = "0.2"
reqwest = { workspace = true }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
urlencoding = "2"
yahoo_finance_api = "4.2"
lazy_static = "1.4"

[target.'cfg(target_os = "android")'.dependencies]
# Yahoo 4.2 uses reqwest 0.13, independently of the workspace's 0.12 client.
reqwest-yahoo = { package = "reqwest", version = "0.13.5", default-features = false, features = ["rustls"] }
webpki-root-certs = "1.0.9"

[dev-dependencies]
rust_decimal_macros = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
